name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from version.txt
        id: ver
        run: echo "APP_VERSION=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate app icons & splash (из assets/)
        run: npx --yes @capacitor/assets generate --android

      - name: Restore stable debug keystore (постоянная подпись для обновлений поверх)
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          mkdir -p "$HOME/.android"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          # защита: если ключ не восстановился — падаем вместо случайной подписи
          python3 - <<'PY'
          import os, sys
          ks = os.path.expanduser('~/.android/debug.keystore')
          size = os.path.getsize(ks) if os.path.exists(ks) else 0
          print('keystore size:', size)
          if size < 1000:
              print('KEystore EMPTY — сборка остановлена, чтобы не подписать случайным ключом!')
              sys.exit(1)
          PY

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Lock landscape orientation (детям — только горизонтально)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"', 1)
          open(p, 'w').write(s)
          print('landscape locked:', 'screenOrientation' in s)
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Log APK signature fingerprint (контроль постоянства подписи)
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          z = zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk')
          n = [x for x in z.namelist() if x.startswith('META-INF/') and x.endswith('.RSA')][0]
          print('CERT SHA256:', hashlib.sha256(z.read(n)).hexdigest())
          PY

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "wonder-meadow-${{ steps.ver.outputs.APP_VERSION }}-b${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wonder-meadow-apk
          path: wonder-meadow-*.apk
          retention-days: 30
