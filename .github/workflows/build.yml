name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from version.txt
        id: ver
        run: echo "APP_VERSION=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate app icons & splash (из assets/)
        run: npx --yes @capacitor/assets generate --android

      - name: Restore stable debug keystore (постоянная подпись для обновлений поверх)
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          mkdir -p "$HOME/.android"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          # защита: если ключ не восстановился — падаем вместо случайной подписи
          python3 - <<'PY'
          import os, sys
          ks = os.path.expanduser('~/.android/debug.keystore')
          size = os.path.getsize(ks) if os.path.exists(ks) else 0
          print('keystore size:', size)
          if size < 1000:
              print('KEystore EMPTY — сборка остановлена, чтобы не подписать случайным ключом!')
              sys.exit(1)
          PY
          # диагностика: хэш файла и отпечаток ключа (должны совпадать между сборками!)
          sha256sum android/app/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -v | grep "SHA256:" || echo "KEYTOOL FAILED — файл не читается как keystore!"

      - name: Pin debug signing to OUR keystore (без этого gradle генерирует случайный ключ каждую сборку)
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          inject = """    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }
          """
          if 'signingConfigs' not in s:
              s = s.replace('defaultConfig {', inject + '    defaultConfig {', 1)
              open(p, 'w').write(s)
          print('signing pinned:', 'signingConfigs' in s)
          PY

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Lock landscape orientation (детям — только горизонтально)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"', 1)
          open(p, 'w').write(s)
          print('landscape locked:', 'screenOrientation' in s)
          PY

      - name: Fullscreen immersive mode (без белых полос и системной панели — детская игра)
        run: |
          python3 - <<'PY'
          import glob
          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          p = paths[0]
          pkg = open(p).read().split('package ')[1].split(';')[0].strip()
          open(p, 'w').write(f'''package {pkg};

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
            @Override public void onCreate(Bundle savedInstanceState) {{
              super.onCreate(savedInstanceState);
              hideSystemUI();
            }}
            @Override public void onWindowFocusChanged(boolean hasFocus) {{
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemUI();
            }}
            private void hideSystemUI() {{
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }}
          }}
          ''')
          print('immersive MainActivity written to', p)
          PY
          cat android/app/src/main/java/*/*.java | head -3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Log APK signature fingerprint (контроль постоянства подписи)
        run: |
          # отпечаток СЕРТИФИКАТА — стабилен между сборками с одним ключом
          # (хэш сырого CERT.RSA меняется каждый раз из-за метки времени подписи!)
          cd android/app/build/outputs/apk/debug
          unzip -p app-debug.apk META-INF/CERT.RSA > /tmp/cert.rsa
          echo "STABLE CERT FINGERPRINT:"
          openssl pkcs7 -inform DER -in /tmp/cert.rsa -print_certs | openssl x509 -noout -fingerprint -sha256
          echo "(ожидаем: 50:7E:7D:84:69:A2:8B:7B:8A:91:B7:85:B9:BA:6B:AA:93:4D:91:97:87:79:A7:FF:02:F8:F7:ED:A3:DA:85:5B)"

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "wonder-meadow-${{ steps.ver.outputs.APP_VERSION }}-b${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wonder-meadow-apk
          path: wonder-meadow-*.apk
          retention-days: 30
