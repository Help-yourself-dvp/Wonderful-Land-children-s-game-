<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#aee3f5" />
  <title>Волшебная полянка</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden; background: #aee3f5;
      touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
      font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
    }
    canvas { display: block; }
    #hint {
      position: fixed; left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(255,255,255,0.75); color: #4a6b52;
      font-size: 18px; padding: 10px 22px; border-radius: 24px;
      pointer-events: none; transition: opacity 1.2s ease; opacity: 0;
    }

    /* ================= ЗАСТАВКА ================= */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      overflow: hidden;
      background: linear-gradient(180deg, #cfeefa 0%, #fdeec9 55%, #bfe6b1 100%);
      transition: opacity 0.9s ease;
    }
    #splash svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* солнце встаёт */
    #sSun { animation: sunRise 2.6s cubic-bezier(.22,1,.36,1) both; }
    @keyframes sunRise {
      from { transform: translateY(48%); }
      to   { transform: translateY(0%); }
    }
    #sGlow { animation: glowIn 2.8s ease both; transform-origin: 72% 30%; }
    @keyframes glowIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

    /* холмы дышат параллаксом */
    .hill { animation: hillDrift 9s ease-in-out infinite alternate; }
    .hill.h2 { animation-duration: 12s; animation-delay: -3s; }
    .hill.h3 { animation-duration: 15s; animation-delay: -6s; }
    @keyframes hillDrift { from { transform: translateX(-1.2%); } to { transform: translateX(1.2%); } }

    /* дерево растёт с упругим до-ходом */
    #sTree { transform-origin: 22% 88%; animation: treeGrow 1.6s cubic-bezier(.34,1.56,.64,1) .5s both; }
    @keyframes treeGrow { from { transform: scale(0); } to { transform: scale(1); } }
    #sTree .leaf { transform-box: fill-box; transform-origin: center; animation: leafPop .8s cubic-bezier(.34,1.56,.64,1) both; }
    #sTree .leaf.l1 { animation-delay: 1.2s; }
    #sTree .leaf.l2 { animation-delay: 1.4s; }
    #sTree .leaf.l3 { animation-delay: 1.6s; }
    @keyframes leafPop { from { transform: scale(0); } to { transform: scale(1); } }

    /* мягкие светящиеся частички поднимаются */
    .mote { opacity: 0; animation: moteRise 4.5s ease-in-out infinite; }
    @keyframes moteRise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: .8; }
      80% { opacity: .5; }
      100% { transform: translateY(-90px); opacity: 0; }
    }

    /* заголовок */
    #splash .title-wrap {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 0 24px;
      transform: translateY(-8vh);
    }
    #splash h1 {
      margin: 0; font-weight: 800; letter-spacing: .5px;
      font-size: clamp(30px, 7.5vw, 58px); color: #3d5c44;
      opacity: 0; animation: fadeUp 1s ease .9s both;
    }
    #splash h1 .accent { color: #e0813f; }
    #splash .sub {
      margin: 0; color: #5d7a63; font-size: clamp(15px, 3.2vw, 21px);
      opacity: 0; animation: fadeUp 1s ease 1.5s both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* линия загрузки-росток */
    #splash .bar {
      position: absolute; left: 50%; bottom: calc(9vh + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(46vw, 260px); height: 6px; border-radius: 99px;
      background: rgba(61,92,68,0.18); overflow: hidden;
      opacity: 0; animation: fadeUp .6s ease 1.2s both;
    }
    #splash .bar i {
      display: block; height: 100%; width: 0; border-radius: 99px;
      background: linear-gradient(90deg, #8ed081, #6cbf6f);
      animation: barGrow 2.3s cubic-bezier(.4,0,.2,1) .3s both;
    }
    @keyframes barGrow { from { width: 0; } to { width: 100%; } }

    /* ================= ВЫБОР ДРУГА ================= */
    #select {
      position: fixed; inset: 0; z-index: 15;
      display: none; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: calc(56px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #select .card {
      pointer-events: auto;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 30px; padding: 22px 28px; text-align: center;
      box-shadow: 0 12px 40px rgba(61,92,68,0.22);
      animation: cardIn .55s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes cardIn { from { transform: translateY(40px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
    #select h2 { margin: 0 0 16px; color: #3d5c44; font-size: clamp(19px, 4.4vw, 28px); font-weight: 700; }
    #select .row { display: flex; gap: 20px; }
    .char-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .char-wrap span { color: #5d7a63; font-size: 14px; font-weight: 600; }
    .char {
      width: clamp(78px, 17vw, 106px); height: clamp(78px, 17vw, 106px);
      border-radius: 34%; border: 3px solid rgba(255,255,255,.9);
      background: linear-gradient(180deg, #ffffff, #eef7ea);
      font-size: clamp(40px, 9vw, 54px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 6px 18px rgba(61,92,68,0.18);
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
      -webkit-tap-highlight-color: transparent;
      opacity: 0; animation: charIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .char-wrap:nth-child(1) .char { animation-delay: .15s; }
    .char-wrap:nth-child(2) .char { animation-delay: .28s; }
    .char-wrap:nth-child(3) .char { animation-delay: .41s; }
    @keyframes charIn { from { transform: translateY(26px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    .char:active { transform: scale(.88); }

    .fade-out { opacity: 0; pointer-events: none; }

    /* ================= HUD: КАПЕЛЬКИ ================= */
    #drops {
      position: fixed; z-index: 10;
      top: calc(12px + env(safe-area-inset-top)); right: 14px;
      display: none; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
      border-radius: 99px; padding: 8px 16px;
      color: #2e6f8e; font-size: 20px; font-weight: 700;
      box-shadow: 0 4px 14px rgba(46,111,142,0.18);
      pointer-events: none;
    }
    #drops.pop { animation: dropPop .5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes dropPop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
    /* кнопка звука */
    #muteBtn {
      position: fixed; z-index: 10;
      top: calc(12px + env(safe-area-inset-top)); left: 14px;
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
      font-size: 22px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(61,92,68,0.18);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #muteBtn:active { transform: scale(.9); }

    /* ================= АЛЬБОМ НАКЛЕЕК ================= */
    #albumBtn {
      position: fixed; z-index: 10;
      bottom: calc(16px + env(safe-area-inset-bottom)); right: 14px;
      width: 56px; height: 56px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      font-size: 28px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(61,92,68,0.22);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #albumBtn:active { transform: scale(.9); }
    #albumBtn.pop { animation: dropPop .5s cubic-bezier(.34,1.56,.64,1); }
    #album {
      position: fixed; inset: 0; z-index: 30; display: none;
      background: rgba(61,92,68,0.35);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #album .sheet {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: min(92vw, 560px); height: min(78vh, 480px);
      background: #fdfaf1; border-radius: 26px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.25);
      padding: 18px; box-sizing: border-box;
      animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) both;
      display: flex; flex-direction: column;
    }
    #album h3 { margin: 4px 0 10px; text-align: center; color: #4a6b52; font-size: 22px; }
    #albumField { position: relative; flex: 1; border-radius: 18px; background: repeating-linear-gradient(0deg, #f7f1de 0 34px, #f0e8d0 34px 36px); overflow: hidden; }
    .sticker {
      position: absolute; font-size: 46px; line-height: 1;
      touch-action: none; cursor: grab;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.18));
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
      -webkit-tap-highlight-color: transparent;
    }
    .sticker:active { transform: scale(1.2); }
    .sticker.locked { filter: grayscale(1); opacity: 0.25; cursor: default; }
    #albumClose {
      position: absolute; top: 10px; right: 10px;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: #ffd9d9; color: #b04a4a; font-size: 20px; font-weight: 700;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #albumClose:active { transform: scale(.9); }
  </style>
</head>
<body>
  <div id="hint">👆 Нажми на полянку — зверёк побежит туда</div>
  <div id="drops">💧 <b id="dropsNum">0</b></div>
  <button id="muteBtn" aria-label="звук">🔊</button>
  <button id="albumBtn" aria-label="альбом">📖</button>

  <div id="album">
    <div class="sheet">
      <button id="albumClose">✖</button>
      <h3>Мой альбом наклеек</h3>
      <div id="albumField"></div>
    </div>
  </div>

  <div id="splash">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="gSunset" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <!-- свечение и солнце -->
      <g id="sGlow"><circle cx="720" cy="300" r="230" fill="url(#gSunset)"/></g>
      <g id="sSun"><circle cx="720" cy="300" r="62" fill="#ffdf7e"/></g>

      <!-- холмы -->
      <path class="hill h3" d="M-50 780 Q 250 640 520 760 T 1100 750 V1050 H-50 Z" fill="#bfe6b1"/>
      <path class="hill h2" d="M-50 850 Q 300 720 620 830 T 1100 830 V1050 H-50 Z" fill="#a5da92"/>
      <path class="hill"    d="M-50 930 Q 350 820 700 920 T 1100 910 V1050 H-50 Z" fill="#8ed081"/>

      <!-- дерево -->
      <g id="sTree">
        <rect x="205" y="700" width="26" height="150" rx="12" fill="#9a6b4f"/>
        <circle class="leaf l1" cx="218" cy="640" r="72" fill="#6cbf6f"/>
        <circle class="leaf l2" cx="268" cy="686" r="46" fill="#7ecb7f"/>
        <circle class="leaf l3" cx="172" cy="692" r="42" fill="#8fd07a"/>
      </g>

      <!-- частички -->
      <g filter="url(#soft)">
        <circle class="mote" cx="430" cy="620" r="7" fill="#ffffff" style="animation-delay:0s"/>
        <circle class="mote" cx="560" cy="560" r="5" fill="#fff3c9" style="animation-delay:.9s"/>
        <circle class="mote" cx="660" cy="630" r="6" fill="#ffffff" style="animation-delay:1.8s"/>
        <circle class="mote" cx="360" cy="560" r="4" fill="#ffdfef" style="animation-delay:2.6s"/>
        <circle class="mote" cx="790" cy="600" r="5" fill="#ffffff" style="animation-delay:3.2s"/>
      </g>
    </svg>

    <div class="title-wrap">
      <h1>🌳 Волшебная <span class="accent">полянка</span></h1>
      <p class="sub">Добрые приключения с пользой</p>
    </div>
    <div class="bar"><i></i></div>
  </div>

  <div id="select">
    <div class="card">
      <h2>Кто будет твоим другом?</h2>
      <div class="row">
        <div class="char-wrap"><div class="char" data-char="bunny">🐰</div><span>Зайка</span></div>
        <div class="char-wrap"><div class="char" data-char="fox">🦊</div><span>Лисёнок</span></div>
        <div class="char-wrap"><div class="char" data-char="bear">🐻</div><span>Мишка</span></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
