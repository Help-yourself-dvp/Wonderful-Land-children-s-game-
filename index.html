<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#aee3f5" />
  <title>Волшебная полянка</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #aee3f5;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    #hint {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.75);
      color: #4a6b52;
      font-size: 18px;
      padding: 10px 22px;
      border-radius: 24px;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
  </style>
</head>
<body>
  <div id="hint">👆 Нажми на полянку — зверёк побежит туда</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
